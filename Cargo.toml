[package]
name = "ggpage"
version = "0.1.0"
edition = "2024"
description = "A deluxe terminal pager for SQL client output — a drop-in replacement for less."
license = "MIT"
repository = "https://github.com/gmgreenfield/ggpage"
readme = "README.md"
keywords = ["pager", "mysql", "sql", "tui", "less"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = { version = "0.29.0", features = ["osc52"] }
ratatui = "0.30.2"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
